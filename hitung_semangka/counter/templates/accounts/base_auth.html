<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% block title %}<title>Deteksi Semangka</title>{% endblock %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ambil persis style :root dst dari base.html kamu -->
  <style>
    :root {
      --bg: #0f1220;
      --panel: rgba(255,255,255,.08);
      --panel-2: rgba(255,255,255,.10);
      --border: rgba(255,255,255,.15);
      --text: #ffffff;
      --muted: rgba(255,255,255,.85);
      --brand: #56d9b4;
      --brand-2: #33b79b;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body{
      font-family: "Poppins", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(86,217,180,.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(120,140,255,.14), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .main{
      min-height: 100vh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
    }

    .card-soft{
      background: rgba(20,24,40,.95);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      color: #ffffff;
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body>
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
